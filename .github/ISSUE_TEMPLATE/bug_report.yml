name: Bug report
description: Report a reproducible defensive-tool issue
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include sanitized local input only. Never include secrets, live targets, or private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
